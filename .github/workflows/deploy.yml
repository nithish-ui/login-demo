
name: Deploy Login Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Verify AWS credentials
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      # 4. Setup AWS SAM
      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      # 5. Build SAM application
      - name: Build SAM application
        run: sam build

      # 6. Deploy SAM application
      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name ${{ vars.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

           # 7. Verify frontend S3 bucket variable
      - name: Verify frontend S3 bucket
        env:
          FRONTENDS3_BUCKET: ${{ vars.FRONTENDS3_BUCKET }}
        run: |
          if [ -z "$FRONTENDS3_BUCKET" ]; then
            echo "ERROR: FRONTENDS3_BUCKET repository variable is missing or empty."
            exit 1
          fi

          echo "S3 bucket configured: $FRONTENDS3_BUCKET"

      # 8. Upload frontend to S3
      - name: Upload frontend to S3
        env:
          FRONTENDS3_BUCKET: ${{ vars.FRONTENDS3_BUCKET }}
        run: |
          aws s3 sync ./frontend/ "s3://${FRONTENDS3_BUCKET}/"

      # 8. Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
